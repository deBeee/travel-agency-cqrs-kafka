<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 810" width="1400" height="810" role="img"
     aria-labelledby="title desc">
  <title id="title">Data model: write model in MySQL, Avro contracts on Kafka, read model in MongoDB</title>
  <desc id="desc">Left: the write model tables in MySQL (hotels, bookings as date ranges, daily_availabilities counters
    used for locking, outbox, dead_letter_outbox, shedlock). Middle: the three Avro records that travel through Kafka.
    Right: the MongoDB read model with one availability document per hotel and day plus a hotels collection. Arrows
    show how data flows from tables through the outbox and Kafka into the read model.</desc>

  <defs>
    <marker id="d-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="d-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #1f2937; }
      .h1   { font-size: 22px; font-weight: 700; }
      .h2   { font-size: 13px; fill: #64748b; }
      .grp  { font-size: 12px; font-weight: 700; }
      .tn   { font-size: 12.5px; font-weight: 700; }
      .tsub { font-size: 10.5px; fill: #92400e; }
      .col  { font-size: 11px; }
      .typ  { font-size: 10.5px; fill: #64748b; }
      .cap  { font-size: 10.5px; fill: #64748b; font-style: italic; }
      .lbl  { font-size: 10.5px; fill: #64748b; font-style: italic; }
      .note { font-size: 12px; fill: #334155; }
      .leg  { font-size: 12px; fill: #475569; }
      .sync  { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#d-sync); }
      .event { fill: none; stroke: #b45309; stroke-width: 2.2; marker-end: url(#d-event); }
      .grp-cmd { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
      .grp-kfk { fill: #fffbeb; stroke: #d97706; stroke-width: 1.4; }
      .grp-qry { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.4; }
      .tb    { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .th-cmd { fill: #dbeafe; }
      .th-kfk { fill: #fef3c7; }
      .th-qry { fill: #ccfbf1; }
      .notebg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1400" height="810" fill="#ffffff"/>

  <!-- heading -->
  <text x="40" y="44" class="sans h1">Data model: intervals on the write side, days on the read side</text>
  <text x="40" y="68" class="sans h2">Column names as Hibernate and Spring Data create them. The two sides share no database and meet only on Kafka.</text>

  <!-- ============================== WRITE MODEL ============================== -->
  <rect x="40" y="96" width="600" height="588" rx="12" class="grp-cmd"/>
  <text x="54" y="114" class="sans grp" fill="#1e40af">WRITE MODEL (MySQL, travels_write_db)</text>

  <!-- hotels -->
  <rect x="56" y="130" width="270" height="70" rx="6" class="tb"/>
  <path d="M56,136 a6,6 0 0 1 6,-6 h258 a6,6 0 0 1 6,6 v20 h-270 z" class="th-cmd"/>
  <text x="66" y="148" class="mono tn">hotels</text>
  <text x="66" y="174" class="mono col">id</text>
  <text x="316" y="174" text-anchor="end" class="sans typ">BIGINT, PK, generated</text>
  <text x="66" y="192" class="mono col">capacity</text>
  <text x="316" y="192" text-anchor="end" class="sans typ">BIGINT</text>

  <!-- bookings -->
  <rect x="56" y="216" width="270" height="160" rx="6" class="tb"/>
  <path d="M56,222 a6,6 0 0 1 6,-6 h258 a6,6 0 0 1 6,6 v20 h-270 z" class="th-cmd"/>
  <text x="66" y="234" class="mono tn">bookings</text>
  <text x="66" y="260" class="mono col">id</text>
  <text x="316" y="260" text-anchor="end" class="sans typ">BIGINT, PK, generated</text>
  <text x="66" y="278" class="mono col">hotel_id</text>
  <text x="316" y="278" text-anchor="end" class="sans typ">BIGINT, hotels.id without FK</text>
  <text x="66" y="296" class="mono col">user_id</text>
  <text x="316" y="296" text-anchor="end" class="sans typ">BIGINT</text>
  <text x="66" y="314" class="mono col">start_date</text>
  <text x="316" y="314" text-anchor="end" class="sans typ">DATE</text>
  <text x="66" y="332" class="mono col">end_date</text>
  <text x="316" y="332" text-anchor="end" class="sans typ">DATE, inclusive</text>
  <text x="66" y="352" class="sans cap">index idx_dates (hotel_id, start_date, end_date)</text>
  <text x="66" y="367" class="sans cap">one row per booking: a date range</text>

  <!-- daily_availabilities -->
  <rect x="56" y="392" width="270" height="120" rx="6" class="tb"/>
  <path d="M56,398 a6,6 0 0 1 6,-6 h258 a6,6 0 0 1 6,6 v20 h-270 z" class="th-cmd"/>
  <text x="66" y="410" class="mono tn">daily_availabilities</text>
  <text x="66" y="436" class="mono col">hotel_id</text>
  <text x="316" y="436" text-anchor="end" class="sans typ">BIGINT, PK</text>
  <text x="66" y="454" class="mono col">date</text>
  <text x="316" y="454" text-anchor="end" class="sans typ">DATE, PK</text>
  <text x="66" y="472" class="mono col">occupied_rooms</text>
  <text x="316" y="472" text-anchor="end" class="sans typ">BIGINT</text>
  <text x="66" y="492" class="sans cap">composite PK (hotel_id, date), locked FOR UPDATE</text>
  <text x="66" y="507" class="sans cap">per day: this row enforces "no overbooking"</text>

  <!-- outbox -->
  <rect x="356" y="130" width="270" height="180" rx="6" class="tb"/>
  <path d="M356,136 a6,6 0 0 1 6,-6 h258 a6,6 0 0 1 6,6 v20 h-270 z" class="th-cmd"/>
  <text x="366" y="148" class="mono tn">outbox</text>
  <text x="366" y="174" class="mono col">id</text>
  <text x="616" y="174" text-anchor="end" class="sans typ">UUID, PK</text>
  <text x="366" y="192" class="mono col">aggregate_id</text>
  <text x="616" y="192" text-anchor="end" class="sans typ">VARCHAR, hotelId as Kafka key</text>
  <text x="366" y="210" class="mono col">type</text>
  <text x="616" y="210" text-anchor="end" class="sans typ">BookingCreated | HotelUpserted</text>
  <text x="366" y="228" class="mono col">topic</text>
  <text x="616" y="228" text-anchor="end" class="sans typ">VARCHAR, target topic</text>
  <text x="366" y="246" class="mono col">payload</text>
  <text x="616" y="246" text-anchor="end" class="sans typ">LOB, JSON (Avro only in the relay)</text>
  <text x="366" y="264" class="mono col">created_at</text>
  <text x="616" y="264" text-anchor="end" class="sans typ">DATETIME, relay order</text>
  <text x="366" y="282" class="mono col">retry_count</text>
  <text x="616" y="282" text-anchor="end" class="sans typ">INT</text>
  <text x="366" y="301" class="sans cap">written in the same transaction, deleted after broker ack</text>

  <!-- dead_letter_outbox -->
  <rect x="356" y="342" width="270" height="180" rx="6" class="tb"/>
  <path d="M356,348 a6,6 0 0 1 6,-6 h258 a6,6 0 0 1 6,6 v20 h-270 z" class="th-cmd"/>
  <text x="366" y="360" class="mono tn">dead_letter_outbox</text>
  <text x="366" y="386" class="mono col">id</text>
  <text x="616" y="386" text-anchor="end" class="sans typ">UUID, PK</text>
  <text x="366" y="404" class="mono col">original_outbox_id</text>
  <text x="616" y="404" text-anchor="end" class="sans typ">UUID</text>
  <text x="366" y="422" class="mono col">aggregated_id, type</text>
  <text x="616" y="422" text-anchor="end" class="sans typ">VARCHAR</text>
  <text x="366" y="440" class="mono col">payload</text>
  <text x="616" y="440" text-anchor="end" class="sans typ">LOB, original JSON</text>
  <text x="366" y="458" class="mono col">error_message</text>
  <text x="616" y="458" text-anchor="end" class="sans typ">LOB</text>
  <text x="366" y="476" class="mono col">created_at, failed_at</text>
  <text x="616" y="476" text-anchor="end" class="sans typ">DATETIME</text>
  <text x="366" y="494" class="mono col">retry_count</text>
  <text x="616" y="494" text-anchor="end" class="sans typ">INT</text>
  <text x="366" y="513" class="sans cap">payloads that can never be converted to Avro</text>

  <!-- shedlock -->
  <rect x="356" y="554" width="270" height="116" rx="6" class="tb"/>
  <path d="M356,560 a6,6 0 0 1 6,-6 h258 a6,6 0 0 1 6,6 v20 h-270 z" class="th-cmd"/>
  <text x="366" y="572" class="mono tn">shedlock</text>
  <text x="366" y="598" class="mono col">name</text>
  <text x="616" y="598" text-anchor="end" class="sans typ">VARCHAR, PK</text>
  <text x="366" y="616" class="mono col">lock_until, locked_at</text>
  <text x="616" y="616" text-anchor="end" class="sans typ">TIMESTAMP(3)</text>
  <text x="366" y="634" class="mono col">locked_by</text>
  <text x="616" y="634" text-anchor="end" class="sans typ">VARCHAR</text>
  <text x="366" y="654" class="sans cap">one outbox relay instance at a time (ShedLock)</text>

  <!-- write-side arrows -->
  <line x1="326" y1="165" x2="354" y2="165" class="sync"/>
  <polyline points="326,296 341,296 341,200 354,200" class="sync"/>
  <line x1="490" y1="310" x2="490" y2="340" class="sync"/>
  <text x="498" y="329" class="sans lbl">conversion failure</text>

  <!-- ============================== CONTRACTS ============================== -->
  <rect x="700" y="96" width="280" height="588" rx="12" class="grp-kfk"/>
  <text x="714" y="114" class="sans grp" fill="#92400e">CONTRACTS (Avro on Kafka, Schema Registry)</text>

  <!-- HotelUpserted -->
  <rect x="715" y="130" width="250" height="88" rx="6" class="tb"/>
  <path d="M715,136 a6,6 0 0 1 6,-6 h238 a6,6 0 0 1 6,6 v20 h-250 z" class="th-kfk"/>
  <text x="725" y="148" class="mono tn">HotelUpserted</text>
  <text x="725" y="170" class="sans tsub">travel.hotels, compacted, key = hotelId</text>
  <text x="725" y="190" class="mono col">hotelId</text>
  <text x="955" y="190" text-anchor="end" class="sans typ">long</text>
  <text x="725" y="208" class="mono col">capacity</text>
  <text x="955" y="208" text-anchor="end" class="sans typ">long</text>

  <!-- BookingCreated -->
  <rect x="715" y="250" width="250" height="142" rx="6" class="tb"/>
  <path d="M715,256 a6,6 0 0 1 6,-6 h238 a6,6 0 0 1 6,6 v20 h-250 z" class="th-kfk"/>
  <text x="725" y="268" class="mono tn">BookingCreated</text>
  <text x="725" y="290" class="sans tsub">travel.bookings, key = hotelId</text>
  <text x="725" y="310" class="mono col">id</text>
  <text x="955" y="310" text-anchor="end" class="sans typ">long</text>
  <text x="725" y="328" class="mono col">hotelId</text>
  <text x="955" y="328" text-anchor="end" class="sans typ">long</text>
  <text x="725" y="346" class="mono col">userId</text>
  <text x="955" y="346" text-anchor="end" class="sans typ">long</text>
  <text x="725" y="364" class="mono col">start</text>
  <text x="955" y="364" text-anchor="end" class="sans typ">string, ISO date</text>
  <text x="725" y="382" class="mono col">end</text>
  <text x="955" y="382" text-anchor="end" class="sans typ">string, ISO date, inclusive</text>

  <line x1="840" y1="392" x2="840" y2="438" class="event"/>
  <text x="848" y="411" class="sans lbl">Kafka Streams turns it</text>
  <text x="848" y="424" class="sans lbl">into per-day counters</text>

  <!-- AvailabilityUpdated -->
  <rect x="715" y="440" width="250" height="106" rx="6" class="tb"/>
  <path d="M715,446 a6,6 0 0 1 6,-6 h238 a6,6 0 0 1 6,6 v20 h-250 z" class="th-kfk"/>
  <text x="725" y="458" class="mono tn">AvailabilityUpdated</text>
  <text x="725" y="480" class="sans tsub">travel.availability, key = hotelId</text>
  <text x="725" y="500" class="mono col">hotelId</text>
  <text x="955" y="500" text-anchor="end" class="sans typ">long</text>
  <text x="725" y="518" class="mono col">date</text>
  <text x="955" y="518" text-anchor="end" class="sans typ">string, ISO date</text>
  <text x="725" y="536" class="mono col">occupied</text>
  <text x="955" y="536" text-anchor="end" class="sans typ">long, absolute count</text>

  <rect x="715" y="572" width="250" height="98" rx="6" class="notebg"/>
  <text x="725" y="592" class="sans cap">.avsc files duplicated byte for byte in both</text>
  <text x="725" y="607" class="sans cap">modules: same namespace and name give the</text>
  <text x="725" y="622" class="sans cap">same subject (&lt;topic&gt;-value) in the registry.</text>
  <text x="725" y="642" class="sans cap">Dates travel as ISO strings and are parsed</text>
  <text x="725" y="657" class="sans cap">at the edges, no Avro logical types.</text>

  <!-- outbox -> contracts -->
  <polyline points="626,200 670,200 670,174 713,174" class="event"/>
  <polyline points="626,240 660,240 660,320 713,320" class="event"/>

  <!-- ============================== READ MODEL ============================== -->
  <rect x="1040" y="96" width="320" height="588" rx="12" class="grp-qry"/>
  <text x="1054" y="114" class="sans grp" fill="#115e59">READ MODEL (MongoDB, travels_read_db)</text>

  <!-- hotels (mongo) -->
  <rect x="1055" y="130" width="290" height="104" rx="6" class="tb"/>
  <path d="M1055,136 a6,6 0 0 1 6,-6 h278 a6,6 0 0 1 6,6 v20 h-290 z" class="th-qry"/>
  <text x="1065" y="148" class="mono tn">hotels</text>
  <text x="1065" y="174" class="mono col">_id</text>
  <text x="1335" y="174" text-anchor="end" class="sans typ">long, hotelId</text>
  <text x="1065" y="192" class="mono col">capacity</text>
  <text x="1335" y="192" text-anchor="end" class="sans typ">long</text>
  <text x="1065" y="212" class="sans cap">cached in memory by the projection. A new capacity</text>
  <text x="1065" y="227" class="sans cap">re-projects the status of all days of that hotel</text>

  <!-- availability -->
  <rect x="1055" y="250" width="290" height="216" rx="6" class="tb"/>
  <path d="M1055,256 a6,6 0 0 1 6,-6 h278 a6,6 0 0 1 6,6 v20 h-290 z" class="th-qry"/>
  <text x="1065" y="268" class="mono tn">availability</text>
  <text x="1065" y="294" class="mono col">_id</text>
  <text x="1335" y="294" text-anchor="end" class="sans typ">string, hotel_{hotelId}_{date}</text>
  <text x="1065" y="312" class="mono col">hotelId</text>
  <text x="1335" y="312" text-anchor="end" class="sans typ">long</text>
  <text x="1065" y="330" class="mono col">date</text>
  <text x="1335" y="330" text-anchor="end" class="sans typ">date</text>
  <text x="1065" y="348" class="mono col">occupied</text>
  <text x="1335" y="348" text-anchor="end" class="sans typ">long, from AvailabilityUpdated</text>
  <text x="1065" y="366" class="mono col">capacity</text>
  <text x="1335" y="366" text-anchor="end" class="sans typ">long, from hotels, added by projection</text>
  <text x="1065" y="384" class="mono col">status</text>
  <text x="1335" y="384" text-anchor="end" class="sans typ">AVAILABLE | LAST_ROOMS | SOLD_OUT</text>
  <text x="1065" y="402" class="mono col">updatedAt</text>
  <text x="1335" y="402" text-anchor="end" class="sans typ">instant</text>
  <text x="1065" y="422" class="sans cap">compound index (hotelId, date)</text>
  <text x="1065" y="437" class="sans cap">one document per hotel and day, upserted by _id</text>
  <text x="1065" y="452" class="sans cap">read as-is, the API adds freeRooms = capacity − occupied</text>

  <!-- example document -->
  <rect x="1055" y="490" width="290" height="170" rx="6" class="notebg"/>
  <text x="1065" y="510" class="sans cap">example document (booking 51 landed on 2026-07-01)</text>
  <text x="1065" y="528" class="mono col">{</text>
  <text x="1065" y="543" class="mono col" xml:space="preserve">  _id: "hotel_100_2026-07-01",</text>
  <text x="1065" y="558" class="mono col" xml:space="preserve">  hotelId: 100,</text>
  <text x="1065" y="573" class="mono col" xml:space="preserve">  date: 2026-07-01,</text>
  <text x="1065" y="588" class="mono col" xml:space="preserve">  occupied: 5,</text>
  <text x="1065" y="603" class="mono col" xml:space="preserve">  capacity: 100,</text>
  <text x="1065" y="618" class="mono col" xml:space="preserve">  status: "AVAILABLE",</text>
  <text x="1065" y="633" class="mono col" xml:space="preserve">  updatedAt: 2026-07-01T10:15:02Z</text>
  <text x="1065" y="648" class="mono col">}</text>

  <!-- contracts -> read model -->
  <line x1="965" y1="174" x2="1053" y2="174" class="event"/>
  <polyline points="965,500 1010,500 1010,348 1053,348" class="event"/>

  <!-- ============================== BOTTOM NOTE ============================== -->
  <rect x="40" y="704" width="1320" height="52" rx="8" class="notebg"/>
  <text x="56" y="726" class="sans note">Same grain, different job: daily_availabilities on the write side is the per-day lock that enforces "no overbooking", while availability on the read side is</text>
  <text x="56" y="744" class="sans note">the pre-computed answer for the UI. Neither side ever reads the other's store. A booking is an interval in MySQL and becomes N day documents in MongoDB only through Kafka.</text>

  <!-- ============================== LEGEND ============================== -->
  <line x1="40" y1="788" x2="80" y2="788" class="sync"/>
  <text x="90" y="792" class="sans leg">written together in one MySQL transaction</text>
  <line x1="360" y1="788" x2="400" y2="788" class="event"/>
  <text x="410" y="792" class="sans leg">carried through Kafka (outbox relay, Kafka Streams, projection)</text>
</svg>
